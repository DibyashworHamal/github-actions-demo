name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t diphamal/my-github-action-app:1.0.0 .

      - name: Push Docker Image
        run: |
          docker push diphamal/my-github-action-app:1.0.0

      - name: run container
        run: |
          docker run -d --name my-github-action-container -p 8080:80 diphamal/my-github-action-app:1.0.0